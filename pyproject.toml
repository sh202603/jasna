[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasna"
version = "0.8.1+modi"
description = "Jasna"
requires-python = ">=3.12"
dependencies = [
  # current_ctx support is merged upstream for PyAV 18.1.0 but is not published yet.
  # Linux releases override this with the pinned upstream-main wheel in build_linux.sh;
  # remove that override and require av>=18.1 once the release reaches PyPI.
  "av>=18,<19",
  "numpy>=1.26",
  "psutil",
  "diffusers",
  "accelerate",
  "huggingface-hub",
  "mmengine==0.10.7",
  "opencv-python<5",
  "Pillow",
  "tqdm",
  "customtkinter",
  "tkinterdnd2",
  "ultralytics",
  "onnx",
  "cryptography>=42",
]

[project.scripts]
jasna = "jasna.main:main"
jasna-framegen = "jasna.framegen_cli:main"

[project.optional-dependencies]
nvidia = [
  "torch==2.12.0+cu130",
  "torchvision==0.27.0+cu130",
  "tensorrt==10.16.1.11",
  "torch-tensorrt==2.12.0",
  "nvidia-vfx",
]
amd = [
  "torch==2.9.1",
  "torchvision==0.24.1",
  "onnxruntime-migraphx==1.23.2; sys_platform == 'linux'",
  "onnxruntime==1.23.2; sys_platform == 'win32'",
  "numpy==1.26.4",
]
dev = [
  "nuitka>=2.4",
  "pytest",
  "pytest-cov",
  "scikit-build",
  "cmake",
  "ninja",
]
# Optional torchcodec backend (opt-in via --video-backend auto|torchcodec).
# 0.13.0 is buggy/unusable; pin >=0.14.0. Install the cu130 build alongside
# torch 2.12, e.g. from https://download.pytorch.org/whl/cu130 . Native-only
# installs work without this extra.
torchcodec = [
  "torchcodec>=0.14.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["jasna*"]
exclude = ["jasna.protection.keytool*", "jasna.protection.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "perf: performance/throughput regression checks (GPU-only, opt-in via -m perf)",
]
filterwarnings = [
  "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:mmengine\\.utils\\.misc",
  "ignore:`torch\\.jit\\.script` is deprecated:DeprecationWarning",
]
