[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasna"
version = "0.7.2+modi"
description = "Jasna"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.12.0+cu130",
  "torchvision==0.27.0+cu130",
  "tensorrt==10.16.1.11",
  "torch-tensorrt==2.12.0",
  "av>=16.1.0",
  "numpy",
  "psutil",
  "diffusers",
  "accelerate",
  "huggingface-hub",
  "mmengine==0.10.7",
  "opencv-python",
  "Pillow",
  "tqdm",
  "customtkinter",
  "tkinterdnd2",
  "ultralytics",
  "nvidia-vfx",
  "onnx",
  "cryptography>=42",
  # cuDNN graph-API frontend for the experimental FP8 upsample backend
  # (--fp8-recon / JASNA_FP8_RECON=1). Runtime cuDNN >=9.17 comes with torch cu130.
  "nvidia-cudnn-frontend",
  # triton for the FP8 glue's torch.compile on Windows (Linux gets pytorch-triton
  # via torch). Version tracks torch 2.12's triton (3.7.x).
  "triton-windows>=3.7,<3.8 ; sys_platform == 'win32'",
]

[project.scripts]
jasna = "jasna.main:main"
jasna-framegen = "jasna.framegen_cli:main"

[project.optional-dependencies]
dev = [
  "nuitka>=2.4",
  "pytest",
  "pytest-cov",
  "scikit-build",
  "cmake",
  "ninja",
]
# Optional torchcodec backend (opt-in via --video-backend auto|torchcodec).
# 0.13.0 is buggy/unusable; pin >=0.14.0. Install the cu130 build alongside
# torch 2.12, e.g. from https://download.pytorch.org/whl/cu130 . Native-only
# installs work without this extra.
torchcodec = [
  "torchcodec>=0.14.0",
]

[tool.setuptools]
packages = ["jasna", "jasna.gui", "jasna.mosaic", "jasna.restorer", "jasna.trt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "perf: performance/throughput regression checks (GPU-only, opt-in via -m perf)",
]
filterwarnings = [
  "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:mmengine\\.utils\\.misc",
  "ignore:`torch\\.jit\\.script` is deprecated:DeprecationWarning",
]
