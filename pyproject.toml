[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jasna"
version = "0.11.1+modi"
description = "Jasna"
requires-python = ">=3.12"
dependencies = [
  # Exact pin: the release VALI wheel is built against the same pyav-ffmpeg libraries
  # this wheel bundles, so bump both together.
  "av==18.1.0",
  "numpy>=1.26",
  "psutil",
  "diffusers",
  "huggingface-hub",
  "safetensors",
  "requests",
  "mmengine==0.10.7",
  "opencv-python<5",
  "Pillow",
  "tqdm",
  "customtkinter==6.0.0",
  "tkinterdnd2",
  "python-vlc==3.0.21203",
  # Older versions cannot reconstruct YOLO checkpoints under the release's weights-only policy.
  "ultralytics>=8.4.96,<8.5",
  # Not imported directly; ultralytics needs it to export YOLO models for TensorRT.
  "onnx",
  "cryptography>=42",
  # cuDNN graph-API frontend for the experimental FP8 upsample backend
  # (--fp8-recon / JASNA_FP8_RECON=1). Runtime cuDNN >=9.17 comes with torch cu130.
  "nvidia-cudnn-frontend",
  # triton for the FP8 glue's torch.compile on Windows (Linux gets pytorch-triton
  # via torch). Version tracks torch 2.12's triton (3.7.x).
  "triton-windows>=3.7,<3.8 ; sys_platform == 'win32'",
]

[project.scripts]
jasna = "jasna.main:main"
jasna-framegen = "jasna.framegen_cli:main"

[project.optional-dependencies]
nvidia = [
  "torch==2.12.1+cu130",
  "torchvision==0.27.1+cu130",
  "tensorrt==10.16.1.11",
  "torch-tensorrt==2.12.0",
  "nvidia-vfx",
  # LTX self-attention kernel (INT8, prebuilt abi3 wheels for Linux and Windows).
  "comfy-kitchen==0.2.36",
  "scipy",
  # torch.compile and the LTX Triton kernels; Linux torch wheels bring triton 3.7.1 themselves.
  "triton-windows==3.7.1.post27; sys_platform == 'win32'",
  # The VALI decode backend needs the corruption-tolerant fork (codeberg.org/Kruk2/vali,
  # DecodeSingleSurfaceAsyncDetailed); with the stock PyPI wheel the reader
  # falls back to PyAV at open time. Release builds install the fork wheel from
  # keytool/wheels/ on top of this pin (see keytool/build_linux.sh).
  "python_vali==4.8.8",
]
# TensorRT-RTX flavor of the NVIDIA stack. Mutually exclusive with the
# `nvidia` extra in a single venv: torch-tensorrt and torch-tensorrt-rtx both
# ship the `torch_tensorrt` package. JIT compilation makes the first-run
# engine build much faster; engines are cached under flavor-tagged names
# (".rtx.linux"/".rtx.win", see engine_paths.engine_system_suffix), so
# standard and RTX caches coexist in one model_weights dir.
nvidia-rtx = [
  "torch==2.12.0+cu130",
  "torchvision==0.27.0+cu130",
  # PyPI; pulls tensorrt_rtx (>=1.4.0.76,<1.5). 2.13.x requires torch 2.13.
  "torch-tensorrt-rtx==2.12.1",
  # RTX builds strongly typed, so fp16 must live in the ONNX graph itself;
  # used by jasna.trt._convert_onnx_bytes_to_fp16.
  "onnxconverter-common>=1.14",
  "nvidia-vfx",
  "python_vali==4.8.8",
]
amd = [
  # Must match the ROCm 10.0 wheels (stable.repo.amd.com/rocm/whl-next) on both
  # OSes; an unsatisfiable pin makes uv silently swap in the PyPI CUDA build.
  "torch==2.12.0",
  "torchvision==0.27.0",
  # AMD runs RF-DETR through the rfdetr torch model (ROCm), not ONNX/MIGraphX,
  # which sidesteps the Windows-only MIGraphX wheels (see issue #240).
  "rfdetr==1.8.3",
  # Newer transformers imports FSDP while resolving AutoBackbone, but the
  # Windows ROCm torch wheel intentionally has no distributed_c10d extension.
  "transformers==5.1.0",
  "numpy==1.26.4",
]
dev = [
  "nuitka>=2.4",
  "pytest",
  "pytest-cov",
  "scikit-build",
  "cmake",
  "ninja",
]
# Optional torchcodec backend (opt-in via --video-backend auto|torchcodec).
# 0.13.0 is buggy/unusable; pin >=0.15.0 (maintenance release over 0.14.0:
# decode EOF fixes, faster forward seeks; encoder/decoder API and NVENC
# capability limits unchanged). Install the cu130 build alongside torch 2.12,
# e.g. from https://download.pytorch.org/whl/cu130 . Native-only installs work
# without this extra.
torchcodec = [
  "torchcodec>=0.15.0",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"jasna.media" = ["*.fatbin"]
"jasna.ltx.native" = [
  "*.cpp", "*.cu", "*.h",
  "sage_attention/*.cu", "sage_attention/*.cuh", "sage_attention/*.h", "sage_attention/NOTICE",
]

[tool.setuptools.packages.find]
include = ["jasna*"]
exclude = ["jasna.protection.keytool*", "jasna.protection.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "perf: performance/throughput regression checks (GPU-only, opt-in via -m perf)",
]
filterwarnings = [
  "ignore:'maxsplit' is passed as positional argument:DeprecationWarning:mmengine\\.utils\\.misc",
  "ignore:`torch\\.jit\\.script` is deprecated:DeprecationWarning",
]
